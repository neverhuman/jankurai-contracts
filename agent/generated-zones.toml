# Generated zones for jankurai-contracts.
# The only generated output tree in this schema/contract repository is target/,
# where the jankurai self-audit writes its repo-score artifacts. It is never
# hand-edited and is regenerated by the audit lane, not committed.

[[zone]]
path = "target/"
source = "jankurai audit (repo-score artifacts)"
command = "bash ops/ci/audit.sh"
read_only = true
write_policy = "auditor_output"
